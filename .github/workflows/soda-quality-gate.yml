name: Bronze Data Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  soda-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyspark==3.5.9 soda-core==3.5.6 soda-core-spark-df==3.5.6

      - name: Install MinIO client
        run: |
          curl -fL -o mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          sudo mv mc /usr/local/bin/mc

      - name: Start MinIO via docker-compose
        run: docker compose up -d minio

      - name: Wait for MinIO to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is ready."
              exit 0
            fi
            echo "Waiting for MinIO... ($i)"
            sleep 2
          done
          echo "MinIO did not become ready in time."
          docker ps
          docker logs minio
          exit 1

      - name: Seed bronze bucket
        run: |
          mc alias set local http://localhost:9000 minioadmin minioadmin123
          mc mb local/bronze
          echo '{"equipment_id": "TOW-001", "equipment_type": "tow_tractor", "timestamp": "2026-01-01T00:00:00+00:00", "engine_hours": 100.0, "temperature_c": 70.0, "fault_code": null}' > valid_record.json
          echo '{"equipment_id": "BAD-ID", "timestamp": "2026-01-01T00:00:00+00:00", "engine_hours": 100.0, "temperature_c": 70.0, "fault_code": null}' > invalid_record.json
          mc cp valid_record.json local/bronze/valid_record.json
          mc cp invalid_record.json local/bronze/invalid_record.json

      - name: Run Soda bronze data contract check
        run: python3 spark_jobs/soda_bronze_check.py
